plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.17.4'
}

group 'indi.bookmarkx'

version '3.1.2'

sourceCompatibility = 17
targetCompatibility = 17

repositories {
    mavenLocal()
    maven { url 'https://mirrors.huaweicloud.com/repository/maven/' }
    maven { url 'https://maven.aliyun.com/repository/central/' }  // 阿里云中央仓库镜像
    mavenCentral()
//    maven { url "https://cache-redirector.jetbrains.com/intellij-repository/releases" }
//    maven { url "https://cache-redirector.jetbrains.com/intellij-repository/snapshots" }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'io.modelcontextprotocol.sdk:mcp-core:1.1.1'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson3:1.1.1'
    implementation 'org.eclipse.jetty:jetty-server:12.1.9'
    implementation 'org.eclipse.jetty.ee10:jetty-ee10-servlet:12.1.9'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    // https://mvnrepository.com/artifact/org.mockito/mockito-all
    testImplementation 'org.mockito:mockito-all:1.10.19'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
}

// See https://github.com/JetBrains/gradle-intellij-plugin/
intellij {
    version = '2022.3.3'
    instrumentCode = false
}

patchPluginXml {

    sinceBuild = '223.0'
    untilBuild = "263.*"

    changeNotes = """
      <b>更新内容 / Changelog</b>
      <p><b>中文</b></p>
      <ul>
        <li>新增可选的书签树节点序号和模块后缀，并优化拖拽排序及顺序持久化</li>
        <li>书签描述支持纯文本和 HTML 两种格式，创建、编辑、预览及 MCP 接口均会保留格式选择</li>
        <li>优化悬浮书签详情弹窗，可根据内容调整尺寸，并支持移动、缩放和屏幕边界适配</li>
        <li>行标签右键菜单新增“在标签树中定位”，可打开工具窗口并选中对应书签</li>
        <li>修复拖拽书签节点后鼠标滚轮无法滚动标签树的问题，并提升行标签刷新的稳定性</li>
        <li>MCP 服务默认调整为关闭，可在插件设置中手动启用</li>
      </ul>
      <p><b>English</b></p>
      <ul>
        <li>Added optional bookmark tree node numbers and module suffixes, with improved drag-and-drop ordering and persistence</li>
        <li>Added Plain Text and HTML bookmark descriptions, preserving the selected format across creation, editing, preview, and MCP operations</li>
        <li>Improved hover detail popups with content-aware sizing, moving, resizing, and screen-boundary handling</li>
        <li>Added Locate in Bookmark Tree to the gutter bookmark menu to open the tool window and select the corresponding bookmark</li>
        <li>Fixed mouse-wheel scrolling after dragging bookmark nodes and improved gutter marker refresh stability</li>
        <li>Changed the MCP service to be disabled by default; it can be enabled manually in the plugin settings</li>
      </ul>
    """
}

publishPlugin {
    token = System.getenv('JETBRAINS_PUBLISH_TOKEN')
    channels = ['default']
    hidden = true
}

tasks.named('initializeIntelliJPlugin') {
    enabled = true
    selfUpdateCheck.set(false)
}

// 禁止过期方法的校验
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:-deprecation'
}

test {
    useJUnitPlatform()
}

runIde {
//    jvmArgs = ['-Duser.language=en', '-Duser.country=US']
//    国际化测试
    jvmArgs = ['-Duser.language=ja', '-Duser.country=JP']
}
